name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CLI and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[exe]'

      - name: Run CLI tests
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m unittest discover -s lib/tests -p "test_*.py" -v

      - name: Build single-file Windows executable
        shell: pwsh
        run: .\build_exe.ps1 -Python python -OutputDirectory dist -OneFile -Clean

      - name: Verify executable and write checksum
        shell: pwsh
        run: |
          .\dist\yibinthesis.exe --version
          $hash = (Get-FileHash .\dist\yibinthesis.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  yibinthesis.exe" | Set-Content -LiteralPath .\dist\SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $tag = $env:GITHUB_REF_NAME
          }
          else {
            $tag = $env:INPUT_TAG
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "A release tag is required."
          }
          $asset = ".\dist\yibinthesis.exe"
          $checksums = ".\dist\SHA256SUMS.txt"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset $checksums --clobber
          }
          else {
            gh release create $tag $asset $checksums --title "YibinThesis $tag" --generate-notes --latest
          }
